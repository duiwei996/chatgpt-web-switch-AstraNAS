name: Build AstraNAS NRO (Self-hosted)

on:
  workflow_dispatch:

concurrency:
  group: astranas-self-hosted-manual-build
  cancel-in-progress: true

permissions:
  contents: read

env:
  ASTRANAS_VERSION: "1.0.7"

jobs:
  build-self-hosted:
    if: github.repository == 'duiwei996/chatgpt-web-switch-AstraNAS' && github.actor == 'duiwei996'
    runs-on: [self-hosted, linux]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Verify version
        run: python3 scripts/check_version.py --require-parent-bump --initial-version 1.0.0
      - name: Build with local/pinned toolchain
        run: |
          set -euo pipefail
          if [[ -x /opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ ]]; then
            export DEVKITPRO=/opt/devkitpro DEVKITA64=/opt/devkitpro/devkitA64
            ./scripts/build_switch.sh
          else
            ./scripts/build_with_bridge_toolchain.sh
          fi
          test -s dist/switch/AstraNAS/AstraNAS.nro
          test -s dist/switch/AstraNAS-NetDiag/AstraNAS-NetDiag.nro
          python3 scripts/check_nro_bundle.py dist "$ASTRANAS_VERSION"
          python3 scripts/package_release.py --root . --dist dist --version "$ASTRANAS_VERSION" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: AstraNAS-v${{ env.ASTRANAS_VERSION }}-self-hosted-${{ github.sha }}
          path: |
            dist/switch/AstraNAS/AstraNAS.nro
            dist/switch/AstraNAS-NetDiag/AstraNAS-NetDiag.nro
            dist/AstraNAS-source.zip
            dist/config.example.ini
            dist/BUILD-MANIFEST.txt
            dist/NRO-SHA256SUMS.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
