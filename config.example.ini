# AstraNAS v1.0.4
config_version=3
# 设置页只选择当前使用的协议；SMB 与 WebDAV 各自保存完整连接参数。
protocol=smb

# SMB 配置（设置 -> SMB 配置 弹窗）
smb_server=192.168.1.10
# 0 = 自动使用 445。
smb_port=0
# 可留空以尝试枚举可见共享；禁止枚举的 NAS 请手工填写。
smb_share=
smb_root=/
smb_username=your_smb_user
smb_password=your_smb_password
# 由 NAS 文件浏览器自动保存；可留空。
smb_remote_dir=

# WebDAV 配置（设置 -> WebDAV 配置 弹窗）
webdav_server=192.168.1.10
# 0 = HTTPS 自动 443 / HTTP 自动 80。
webdav_port=0
webdav_root=/
webdav_username=your_webdav_user
webdav_password=your_webdav_password
webdav_remote_dir=
webdav_profile_tls=true
webdav_profile_tls_verify=true

# 本机文件浏览位置由 AstraNAS 自动保存；NAS 下载默认保存到 local_dir。
local_root=sdmc:/
local_dir=sdmc:/
cache_dir=sdmc:/switch/AstraNAS/cache

manifest=library.json
download_retries=2
# 开启后只执行真正的 SMB/WebDAV 网络直装；条件不满足会明确报错，不自动切换缓存。
network_direct_install=true
# 仅缓存下载模式使用；开启会在下载后额外完整读取文件计算 SHA-256。
verify_sha256=false
# 大体积内容 NCA 的完整 Content ID/CNMT SHA-256；默认关闭以保留安装性能。
# CNMT 元数据在新写入或自动修复时始终强制执行内容哈希校验。
verify_nca_content_hash=false
install_target=sd
delete_source_after_install=true
ignore_required_firmware=false
# 保留 NCA3 结构/声明大小与 RSA-PSS 头签名校验。
validate_nca=true
